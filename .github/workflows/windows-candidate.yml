name: Windows installer acceptance
on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: Release asset ID
        required: true
        type: string
      sha256:
        description: Expected installer SHA-256
        required: true
        type: string
permissions:
  contents: read
jobs:
  accept:
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Prepare external test transport
        shell: pwsh
        run: |
          $hostPython = (Get-Command python -ErrorAction Stop).Source
          "HOST_PYTHON=$hostPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $hostPython -m pip install 'psutil==7.2.2' 'websocket-client==1.8.0'
          if ($LASTEXITCODE -ne 0) { throw 'Controller dependency installation failed' }
      - name: Download verified release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.asset_id }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:ASSET_ID -notmatch '^\d+$' -or $env:EXPECTED_SHA256 -notmatch '^[0-9a-fA-F]{64}$') { throw 'Invalid asset ID or SHA-256' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$env:ASSET_ID"
          $installer = Join-Path $env:RUNNER_TEMP 'candidate.exe'
          Invoke-WebRequest -Uri $uri -Headers $headers -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ine $env:EXPECTED_SHA256) { throw 'Installer SHA-256 mismatch' }
      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'candidate-acceptance'
          New-Item -ItemType Directory -Force -Path $report | Out-Null
          function Entries { @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -like '*MeshPilot*') }
          if (@(Entries).Count -ne 0) { throw 'Pre-existing installation' }
          $target = $null; $testError = $null; $cleanupError = $null; $exitCode = $null; $uninstallExit = $null
          try {
            $p = Start-Process (Join-Path $env:RUNNER_TEMP 'candidate.exe') -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
            $exitCode = $p.ExitCode
            if ($exitCode -ne 0) { throw "Installer exit $exitCode" }
            $entries = @(Entries)
            if ($entries.Count -ne 1) { throw 'Expected one new installation' }
            $target = $entries[0].InstallLocation
            if (-not $target -and $entries[0].UninstallString -match '^"([^"]+)"') { $target = Split-Path -Parent $Matches[1] }
            if (-not $target) { throw 'Install path unavailable' }
            $target = [IO.Path]::GetFullPath($target)
            if ([IO.Path]::GetPathRoot($target).TrimEnd('\') -ieq $env:SystemDrive -or [IO.Path]::GetPathRoot($target) -ieq 'C:\') { throw "Default installation on system drive: $target" }
            $exe = Join-Path $target 'MeshPilot.exe'
            $python = Join-Path $target 'resources/backend/runtime/python.exe'
            $diagnose = Join-Path $target 'resources/backend/app/apps/desktop/diagnose.py'
            foreach ($file in @($exe,$python,$diagnose)) { if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing $file" } }
            $env:PATH = Join-Path $env:SystemRoot 'System32'
            $env:OPENBLAS_NUM_THREADS = '1'; $env:MKL_NUM_THREADS = '1'
            Remove-Item Env:PYTHONPATH,Env:PYTHONHOME -ErrorAction SilentlyContinue
            & $python -B $diagnose *> (Join-Path $report 'diagnostics.log')
            if ($LASTEXITCODE -ne 0) { throw 'Bundled diagnostics failed' }
            & $env:HOST_PYTHON -B (Join-Path $env:GITHUB_WORKSPACE '.github/ci/windows-controller.py') --exe $exe --output $report *> (Join-Path $report 'controller.log')
            if ($LASTEXITCODE -ne 0) { throw 'External desktop controller failed' }
          } catch { $testError = $_.ToString() }
          finally {
            if ($target) {
              $entries = @(Entries); $uninstaller = Join-Path $target 'Uninstall MeshPilot.exe'
              $actual = $null
              if ($entries.Count -eq 1) {
                $actual = $entries[0].InstallLocation
                if (-not $actual -and $entries[0].UninstallString -match '^"([^"]+)"') { $actual = Split-Path -Parent $Matches[1] }
              }
              if ($actual -and [IO.Path]::GetFullPath($actual) -ieq $target -and (Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
                $u = Start-Process $uninstaller -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru; $uninstallExit = $u.ExitCode
                $deadline = [DateTime]::UtcNow.AddSeconds(30)
                do {
                  $gone = -not (Test-Path -LiteralPath (Join-Path $target 'MeshPilot.exe')) -and @(Entries).Count -eq 0
                  if (-not $gone) { Start-Sleep -Milliseconds 500 }
                } while (-not $gone -and [DateTime]::UtcNow -lt $deadline)
                if ($uninstallExit -ne 0 -or -not $gone) { $cleanupError = 'Uninstall failed or incomplete' }
              } else { $cleanupError = 'Installation identity changed; uninstall refused' }
            } elseif (@(Entries).Count -ne 0) { $cleanupError = 'Unidentified installation remains' }
            @{ status = $(if (-not $testError -and -not $cleanupError) {'passed'} else {'failed'}); error = $testError; cleanup_error = $cleanupError; install_path = $target; install_exit = $exitCode; uninstall_exit = $uninstallExit; installer_sha256 = '${{ inputs.sha256 }}' } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $report 'summary.json')
            if ($testError -or $cleanupError) { throw "Acceptance failed: $testError; cleanup: $cleanupError" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-acceptance-report
          path: ${{ runner.temp }}/candidate-acceptance
          retention-days: 7
